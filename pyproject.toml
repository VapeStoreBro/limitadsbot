[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "limitadsbot"
version = "0.1.0"
description = "Telegram advertising automation for Limit Vape marketplace"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.13,<4",
  "aiohttp>=3.10,<4",
  "SQLAlchemy>=2.0.36,<3",
  "asyncpg>=0.30,<1",
  "aiosqlite>=0.20,<1",
  "pydantic-settings>=2.6,<3",
]

[tool.setuptools.packages.find]
include = ["app*"]
